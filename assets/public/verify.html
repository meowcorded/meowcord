<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Verify your email | __INSTANCE_NAME__</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      @font-face {
        font-family: "gg sans";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/assets/66d715454104d24e.woff2) format("woff2");
      }
      @font-face {
        font-family: "gg sans";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(/assets/b272b33815319bae.woff2) format("woff2");
      }
      @font-face {
        font-family: "gg sans";
        font-style: normal;
        font-weight: 800;
        font-display: swap;
        src: url(/assets/b2fdbe507d6ce9ef.woff2) format("woff2");
      }
      :root {
        color-scheme: dark;
        --bg: #121214;
        --text: #dfe0e2;
        --muted: #94959c;
        --accent: #5865f2;
        --accent-hover: #4752c4;
        font-family: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f3f3f5;
          --text: #2f3035;
          --muted: #5c5d64;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      main {
        max-width: 440px;
        padding: 48px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .brand-icon {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        object-fit: cover;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
        font-weight: 800;
        line-height: 1.2;
        text-wrap: balance;
      }
      p {
        margin: 0;
        color: var(--muted);
        text-wrap: pretty;
      }
      #cap {
        margin-top: 24px;
      }
      #cap:empty {
        display: none;
      }
      a {
        margin-top: 32px;
        padding: 10px 20px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        transition:
          background-color 0.15s ease,
          scale 0.2s ease-out;
      }
      a[hidden] {
        display: none;
      }
      a:active {
        scale: 0.97;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      @media (hover: hover) {
        a:hover {
          background: var(--accent-hover);
        }
      }
    </style>
  </head>
  <body>
    <main>
      __INSTANCE_ICON__
      <h1 id="title">Verifying your email</h1>
      <p id="subtitle" role="status">This takes a moment.</p>
      <div id="cap"></div>
      <a id="open" href="/app" hidden>Open __INSTANCE_NAME__</a>
    </main>
    <script>
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const capContainer = document.getElementById("cap");
      const token = new URLSearchParams(location.hash.slice(1)).get("token");

      const show = (heading, text, done = false) => {
        title.textContent = heading;
        subtitle.textContent = text;
        document.getElementById("open").hidden = !done;
      };

      const loadWidget = () => {
        if (customElements.get("cap-widget")) return Promise.resolve();
        Object.assign(window, {
          CAP_CUSTOM_WASM_URL: "/api/v9/auth/cap/cap_wasm_bg.wasm",
          CAP_CUSTOM_HASHWX_URL: "/api/v9/auth/cap/hashwx.wasm",
          CAP_PAKO_URL: "/api/v9/auth/cap/pako.js",
          CAP_DISABLE_WIDGET_REF: true,
        });
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "/api/v9/auth/cap/widget.js";
          script.onload = () => (customElements.get("cap-widget") ? resolve() : reject());
          script.onerror = reject;
          document.head.append(script);
        });
      };

      const askForCap = async () => {
        show("Confirm you're human", "Complete the check below to verify your email.");
        try {
          const config = await fetch("/api/v9/auth/captcha").then((response) => response.json());
          if (!config.endpoint) throw new Error();
          await loadWidget();
          const widget = document.createElement("cap-widget");
          widget.setAttribute("data-cap-api-endpoint", config.endpoint);
          widget.setAttribute("data-cap-disable-haptics", "");
          widget.addEventListener("solve", (event) => {
            capContainer.replaceChildren();
            verify(event.detail.token);
          });
          capContainer.replaceChildren(widget);
        } catch {
          show("Verification didn't load", "Refresh the page to try again.");
        }
      };

      const verify = async (captchaKey) => {
        show("Verifying your email", "This takes a moment.");
        try {
          const response = await fetch("/api/v9/auth/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, ...(captchaKey ? { captcha_key: captchaKey } : {}) }),
          });
          const data = await response.json();
          if (data.captcha_service === "cap") return askForCap();
          if (!response.ok) return show("This link expired", "Request a new verification email from your account settings.");
          show("Email verified", "You can close this page or keep going in the app.", true);
        } catch {
          show("Verification failed", "Check your connection and refresh the page.");
        }
      };

      if (token) verify();
      else show("This link is incomplete", "Open the link from your email again, or copy the whole address into your browser.");
    </script>
  </body>
</html>
